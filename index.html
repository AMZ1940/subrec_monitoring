<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subrecipient Equipment Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: navy header band with red rule and gold tab marker; summary first, register table, map, slide-in record drawer */
:root{
  --navy:#14284b; --navy-deep:#0e1d38; --red:#b3202b; --gold:#c9a227; --gold-ink:#7a5c0c; --on-navy:#ffffff; --on-navy-muted:#c3cbe0;
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#f6f7fa; --ink:#141c2b; --muted:#5b6475; --line:#d9dde6; --line-strong:#b9c0ce;
  --accent:#1f3a68; --accent-soft:#e4eaf5; --tag:#f6efd6; --tag-ink:#4d3b08; --land:#e7ebf2;
  --ok:#2d7650; --ok-soft:#e2f1e8; --warn:#985b0a; --warn-soft:#fbefd9; --crit:#b3202b; --crit-soft:#f9e2e3;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 10px 40px rgba(14,29,56,.22); --btn:#14284b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0e1d38; --navy-deep:#0a1528; --red:#d8414b; --gold:#e0b84a; --gold-ink:#e0b84a; --on-navy:#ffffff; --on-navy-muted:#aab4cc;
  --bg:#0f1522; --surface:#172036; --sunk:#131b2d; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2a3550; --line-strong:#3d4a68;
  --accent:#a9c1ec; --accent-soft:#22325a; --tag:#3a3016; --tag-ink:#f0d68a; --land:#1d2842;
  --ok:#73c497; --ok-soft:#1b3326; --warn:#e3ad5a; --warn-soft:#3a2c14; --crit:#f08088; --crit-soft:#3d1c20;
  --shadow:0 10px 40px rgba(0,0,0,.55); --btn:#2f4f8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0e1d38; --navy-deep:#0a1528; --red:#d8414b; --gold:#e0b84a; --gold-ink:#e0b84a; --on-navy:#ffffff; --on-navy-muted:#aab4cc;
  --bg:#0f1522; --surface:#172036; --sunk:#131b2d; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2a3550; --line-strong:#3d4a68;
  --accent:#a9c1ec; --accent-soft:#22325a; --tag:#3a3016; --tag-ink:#f0d68a; --land:#1d2842;
  --ok:#73c497; --ok-soft:#1b3326; --warn:#e3ad5a; --warn-soft:#3a2c14; --crit:#f08088; --crit-soft:#3d1c20;
  --shadow:0 10px 40px rgba(0,0,0,.55); --btn:#2f4f8a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--on-navy);border-top:4px solid var(--red)}
header.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.proto{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--navy-deep);background:var(--gold);padding:2px 8px;border-radius:3px;font-weight:600}
.sub{color:var(--on-navy-muted);margin:0;max-width:72ch}
nav.tabs{display:flex;gap:6px;overflow-x:auto;align-items:flex-end}
nav.tabs button{font:600 .95rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);border-bottom:0;border-radius:6px 6px 0 0;color:var(--on-navy-muted);padding:9px 18px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--on-navy);background:rgba(255,255,255,.16)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--bg);border-color:var(--bg);box-shadow:inset 0 3px 0 var(--gold)}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible,g.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:22px 60px}
section.view{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;margin:0;max-width:78ch}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--navy)}
.stat.alert{border-top-color:var(--red)}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .d{font-size:.8rem;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.flaglist,.sched,.sitelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flaglist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.flaglist li:first-child,.sched li:first-child,.sitelist li:first-child{border-top:0}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.linkbtn{font:inherit;font-size:.82rem;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.sched li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)}
.p-crit{color:var(--crit);background:var(--crit-soft)} .p-mute{color:var(--muted);background:var(--sunk);border:1px solid var(--line)}
.p-info{color:var(--accent);background:var(--accent-soft)}

.assettag{display:inline-block;font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--tag);color:var(--tag-ink);padding:1px 7px;border-radius:3px;border:1px solid var(--line);letter-spacing:.04em}
.notag{font-family:var(--f-mono);font-size:.78rem;color:var(--crit)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:7px 9px;min-width:0;width:100%}
input[type=checkbox]{width:16px;height:16px;padding:0}
.filters .field{width:auto}
.filters input[type=search]{width:240px;max-width:100%}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:2px solid var(--navy);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
td.mono,.mono{font-family:var(--f-mono);font-size:.8rem}
.desc{font-weight:500}
.dim{color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* grant rules */
.rulehead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.programs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.programs{grid-template-columns:1fr}}
.prog{border-top:3px solid var(--gold)}
.prog ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.prog .src{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.rules{grid-template-columns:1fr}}
.rule .grid,.addform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rule .grid .wide,.addform .wide{grid-column:1/-1}
.rule .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rule .top .prog-chip{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.eff{font-size:.85rem;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.lifegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cfr{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.03em;text-transform:none}
.codebox{font-family:var(--f-mono);font-size:.78rem;min-height:140px}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.maptools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{font:600 .8rem var(--f-body);background:var(--surface);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-navy)}
svg.map{width:100%;height:auto;display:block;background:var(--sunk);border-radius:4px}
svg.map .state{fill:var(--land);stroke:var(--line-strong);stroke-width:1.5}
svg.map g.site{cursor:pointer}
svg.map g.site circle.dot{stroke:var(--surface);stroke-width:2}
svg.map g.site.sel circle.ring{stroke:var(--gold);stroke-width:3;fill:none}
svg.map text{font-family:var(--f-body);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--sunk);stroke-width:4px;stroke-linejoin:round}
svg.map text.n{font-family:var(--f-mono);font-size:11px;font-weight:500;fill:var(--on-navy);stroke:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.sitelist li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.sitelist li:hover{background:var(--sunk)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:4px solid var(--navy);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h2{font-size:1.3rem}
.dbody{overflow-y:auto;padding:4px 20px 30px;display:flex;flex-direction:column;gap:4px}
.closebtn{font:600 1.2rem var(--f-body);background:none;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink);width:34px;height:34px;cursor:pointer;flex:none}
.block{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.block:last-child{border-bottom:0}
dl.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.82rem}
dl.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--navy)}
.dform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dform .wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{width:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .85rem var(--f-body);border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--btn);background:var(--btn);color:var(--on-navy)}
.btn.ghost{background:none;color:var(--accent);border-color:var(--line-strong)}
.btn.danger{background:none;color:var(--crit);border-color:var(--line-strong)}
.owed{font-size:.88rem;background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:9px 16px;border-radius:4px;font-size:.88rem;z-index:30;border-bottom:3px solid var(--gold)}
.revhead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.revhead .field{width:auto;min-width:150px;flex:1 1 150px}
.tablewrap.flat{border-radius:4px}
table.steps{min-width:640px} table.steps td:first-child{width:55%}
table.steps input,table.steps select{min-width:80px}
table.tests{min-width:980px} table.tests td{vertical-align:middle} table.tests td:first-child{min-width:240px}
table.tests tbody tr{cursor:default}
select.tsel{min-width:110px}
select.tsel.good{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
select.tsel.bad{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
textarea[readonly]{background:var(--sunk);font-family:var(--f-mono);font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.flagbox{display:flex;flex-direction:column;gap:6px}
.flagbox div{font-size:.88rem;display:flex;gap:8px;align-items:baseline}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
/* ---- v2 additions ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:end}
.rowbtns{display:flex;gap:6px;flex-wrap:nowrap}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.warnbtn{background:none;color:var(--crit);border-color:var(--crit)}
.btn.dangerfill{background:var(--crit);border-color:var(--crit);color:#fff}
.fundlist{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.fundlist .dim{font-size:.75rem}

/* action bar inside the item pop-out */
.actionbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--sunk)}
.actionbar .lbl{width:100%}

/* funding editor */
.fund-ed{display:flex;flex-direction:column;gap:8px}
.fund-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.fund-tot{font-size:.85rem;padding:6px 10px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.fund-tot.bad{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.iconbtn{font:600 1rem var(--f-body);background:none;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted);width:32px;height:34px;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,20,40,.45)}
.modal .box{background:var(--surface);border-radius:8px;border-top:4px solid var(--red);box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.alertbox{border:1px solid var(--crit);background:var(--crit-soft);color:var(--ink);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.alertbox strong{color:var(--crit)}

/* upload */
.upload{border:2px dashed var(--line-strong);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.upload.drag{border-color:var(--gold);background:var(--tag)}
.mapgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
table.prev{min-width:1000px}
table.prev tbody tr{cursor:default}
table.prev tr.skip td{opacity:.55}
.iss{display:flex;flex-direction:column;gap:3px}
.iss span{font-size:.75rem}
.iss .e{color:var(--crit)} .iss .w{color:var(--warn)} .iss .i{color:var(--muted)}

/* rules: life table */
.lifegrid .lifecell{display:flex;gap:6px;align-items:end}
.lifegrid .lifecell .field{flex:1}
.addlife{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.addlife .field{width:auto;flex:1 1 180px}
.grantmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grantmeta div{font-size:.85rem;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.grantmeta .lbl{display:block}
.log{list-style:none;margin:0;padding:0;font-size:.88rem}
.log li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log li:first-child{border-top:0}

/* reports */
.report{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:18px}
.report h2{font-size:1.4rem}
.report h3{border-bottom:2px solid var(--navy);padding-bottom:4px}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rgrid div{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.rgrid .v{font-family:var(--f-display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
table.chk{min-width:620px} table.chk tbody tr,table.rlist tbody tr{cursor:default}
table.rlist{min-width:1150px;font-size:.82rem}
.ok{color:var(--ok);font-weight:600} .bad{color:var(--crit);font-weight:600}

/* hover help */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;font:600 .65rem var(--f-body);color:var(--accent);cursor:help;vertical-align:middle;margin-left:4px;text-transform:none;letter-spacing:0}
.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media print{
  header.top,.noprint,.toast,nav.tabs{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .report{border:0;padding:0}
  .tablewrap{overflow:visible;border:0}
  table.rlist,table.chk{min-width:0}
}

.tipbox{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 24px));padding:8px 10px;border-radius:4px;background:var(--navy-deep);color:#fff;font:400 .8rem/1.45 var(--f-body);box-shadow:var(--shadow);pointer-events:none}

.authbar{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--on-navy-muted)}
.authbar strong{color:var(--on-navy)}
.btn.authbtn{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
.authmsg{color:#ffd5d8;max-width:46ch}
</style>
</head>
<body>

let nextId = 100;
const LOG = [];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => n == null || n === "" || isNaN(n) ? "—" : (+n).toLocaleString("en-US",{style:"currency",currency:"USD"});
const money0 = n => money(n).replace(/\.\d+$/,"");
const pct = n => (Math.round(n*10)/10) + "%";
const TODAY = new Date();
const iso = d => d.toISOString().slice(0,10);
const parse = d => d ? new Date(d + "T12:00:00") : null;
const fmt = d => d ? d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
const addMonths = (d,m) => { const x = new Date(d); x.setMonth(x.getMonth()+m); return x; };
const monthsBetween = (a,b) => Math.max(0,(b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) - (b.getDate()<a.getDate()?1:0));
const tip = (text, side) => `<span class="tip${side?" "+side:""}" tabindex="0" role="note" aria-label="${esc(text)}" data-tip="${esc(text)}">?</span>`;
const round2 = n => Math.round(n*100)/100;

const awardById = id => AWARDS.find(a => a.id === id);
const award = id => awardById(id) || {id, program:"HSGP", fy:"?", label:"", fedShare:100, stateThreshold:5000, fedThreshold:5000, method:"SL", salvagePct:0, fain:""};
const awardLabel = a => (PROGRAMS[a.program]?.short || a.program) + " " + (a.label ? a.label : "FY " + a.fy);
const srcLabel = src => src === LOCAL ? "Local / State funds" : awardLabel(award(src));
const activeAwards = () => AWARDS.filter(a => !a.archived);
const effThreshold = a => Math.min(a.stateThreshold || Infinity, a.fedThreshold || Infinity);
const fedLines = it => it.funding.filter(l => l.src !== LOCAL);
const fedAmt = (it, id) => fedLines(it).filter(l => !id || l.src === id).reduce((s,l)=>s+(+l.amt||0),0);
const fundTotal = it => it.funding.reduce((s,l)=>s+(+l.amt||0),0);
const fedPct = it => it.cost ? fedAmt(it)/it.cost*100 : 0;
const fundsAward = (it, id) => it.funding.some(l => l.src === id);
const fedAwardIds = it => [...new Set(fedLines(it).map(l=>l.src))];
const primary = it => { const f = fedLines(it).slice().sort((a,b)=>b.amt-a.amt)[0]; return f ? award(f.src) : null; };
const itemThreshold = it => { const t = fedAwardIds(it).map(id => effThreshold(award(id))); return t.length ? Math.min(...t) : 5000; };
const subs = () => [...new Set(items.map(i=>i.sub).filter(Boolean))].sort();

function depreciation(it, asOf=TODAY){
  const g = primary(it) || {method:"SL", salvagePct:0}, life = CATEGORIES[it.cat] || 0;
  const start = parse(it.acquired);
  const end = it.disp?.date ? parse(it.disp.date) : asOf;
  const salvage = it.cost * ((g.salvagePct||0)/100);
  const lifeM = life*12;
  const months = start ? Math.min(monthsBetween(start,end), lifeM) : 0;
  let book, monthly;
  if (!lifeM){ book = it.cost; monthly = 0; }
  else if (g.method === "DDB"){ const r=(2/life)/12; book=Math.max(salvage, it.cost*Math.pow(1-r, months)); monthly=book*r; }
  else { monthly=(it.cost-salvage)/lifeM; book=it.cost-monthly*months; }
  return { life, months, lifeM, monthly, accumulated: it.cost-book, book, fedBook: book*fedPct(it)/100, method:g.method };
}

function status(it){
  if (it.archived) return {key:"archived", label:"Archived", cls:"p-mute"};
  if (it.disp?.date) return {key:"disposed", label:"Disposed", cls:"p-mute"};
  if (it.intangible) return {key:"review", label:"Review – not tangible", cls:"p-info"};
  if (it.cost < itemThreshold(it)) return {key:"below", label:"Below threshold", cls:"p-mute"};
  return {key:"equipment", label:"Equipment", cls:"p-ok"};
}

function inventory(it, asOf=TODAY){
  if (!it.lastInv) return {due:null, state:"none", label:"No inventory recorded", cls:"p-crit"};
  const due = addMonths(parse(it.lastInv), 24);
  const days = (due - asOf)/864e5;
  if (days < 0) return {due, state:"overdue", label:"Inventory overdue", cls:"p-crit"};
  if (days <= 90) return {due, state:"soon", label:"Due within 90 days", cls:"p-warn"};
  return {due, state:"ok", label:"Current", cls:"p-ok"};
}

const FLAG_DEFS = {
  ndaa:{label:"Possible §889 prohibited brand", cls:"p-crit", ref:"NDAA §889", tip:TIP889},

  loc:{label:"Location not specific", cls:"p-warn", ref:"§200.313(d)(1)"},
  basis:{label:"Shared by 2+ federal awards – no allocation basis", cls:"p-warn", ref:"§200.405(d)"},
  ndaaCheck:{label:"Camera or telecom item – confirm brand is §889 compliant", cls:"p-info", ref:"NDAA §889", tip:TIP889},
  intangible:{label:"Software or subscription – confirm classification", cls:"p-info"}
};
const flagPill = k => { const d = FLAG_DEFS[k]; return `<span class="pill ${d.cls}" ${d.tip?`title="${esc(d.tip)}"`:""}>${d.ref || "Check"}</span>`; };

function ndaaState(it){
  const text = it.desc + " " + (it.make||"");
  if (BANNED.test(text)) return "ndaa";
  if (TELECOM.test(text) && !it.ndaaOk) return "ndaaCheck";
  return "";
}

function flags(it, asOf=TODAY){
  const st = status(it), f = [];
  if (st.key === "disposed" || st.key === "archived") return f;
  const n = ndaaState(it); if (n === "ndaa") f.push(n);
  if (st.key === "review"){ f.push("intangible"); return f; }
  if (st.key !== "equipment"){ if (n === "ndaaCheck") f.push(n); return f; }
  if (!it.approval) f.push("approval");
  if (Math.abs(fundTotal(it) - it.cost) > 0.01) f.push("split");
  if (!it.tag) f.push("tag");
  if (!it.serial) f.push("serial");
  if (fedAwardIds(it).some(id => !award(id).fain)) f.push("fain");
  if (!it.title) f.push("title");
  const inv = inventory(it, asOf); if (inv.state === "none" || inv.state === "overdue") f.push("inv");
  if (!it.location || /split|other|\*/i.test(it.location)) f.push("loc");
  if (fedAwardIds(it).length > 1 && !it.basis.trim()) f.push("basis");
  if (n === "ndaaCheck") f.push(n);
  return f;
}

/* ---------- overview ---------- */

function renderOverview(){
  const eq = items.filter(i => status(i).key === "equipment");
  const cost = eq.reduce((s,i)=>s+i.cost,0);

  const flagged = eq.filter(i => flags(i).length).length;
  const counts = {};
  items.forEach(i => flags(i).forEach(k => counts[k]=(counts[k]||0)+1));
  const below = items.filter(i=>status(i).key==="below").length;
  const archived = items.filter(i=>i.archived).length;
  const sched = eq.map(i=>({i, inv:inventory(i)})).sort((a,b)=>(a.inv.due?.getTime() ?? -1)-(b.inv.due?.getTime() ?? -1)).slice(0,6);

      <div class="stat"><span class="k">Current book value</span><span class="v">${money0(book)}</span><span class="d">federal share ${money0(fed)} · as of ${fmt(TODAY)}</span></div>
      <div class="stat alert"><span class="k">Items needing action</span><span class="v" style="color:var(--crit)">${flagged}</span><span class="d">missing a required record field</span></div>
    </div>
    <div class="cols">
      <div class="panel">
        <h3>Record gaps</h3>

function drawRows(){

  const rows = items.filter(i=>{

    if (filter.grant !== "all" && !fundsAward(i, filter.grant)) return false;
    if (filter.flag && !flags(i).includes(filter.flag)) return false;
    if (q && ![i.tag,i.serial,i.desc,i.location,i.title,i.sub,i.make].join(" ").toLowerCase().includes(q)) return false;

/* ---------- funding editor (used by add form and item record) ---------- */
function mountFunding(container, lines, getCost){
  const draw = ()=>{
    const cost = getCost(), total = lines.reduce((s,l)=>s+(+l.amt||0),0);
    const fedIds = [...new Set(lines.filter(l=>l.src&&l.src!==LOCAL).map(l=>l.src))];
    const hint = lines.length===1 && lines[0].src && lines[0].src!==LOCAL && award(lines[0].src).fedShare<100 ? award(lines[0].src) : null;
    container.innerHTML = `<div class="fund-ed">
      ${lines.map((l,n)=>`<div class="fund-row">
        <select aria-label="Funding source ${n+1}" data-n="${n}" data-k="src"><option value="">Choose a source…</option>${activeAwards().map(a=>`<option value="${esc(a.id)}" ${l.src===a.id?"selected":""}>${esc(awardLabel(a))}</option>`).join("")}${l.src && l.src!==LOCAL && award(l.src).archived?`<option selected value="${esc(l.src)}">${esc(srcLabel(l.src))} (archived)</option>`:""}<option value="${LOCAL}" ${l.src===LOCAL?"selected":""}>Local / State funds (non-federal)</option></select>
        <input type="number" step="0.01" min="0" aria-label="Amount ${n+1}" data-n="${n}" data-k="amt" value="${l.amt===""||l.amt==null?"":l.amt}" placeholder="Amount">
        <button type="button" class="iconbtn" data-del="${n}" aria-label="Remove funding source ${n+1}" ${lines.length<2?"disabled":""}>×</button>
      </div>`).join("")}
      <div class="btns"><button type="button" class="btn sm ghost" data-addline>Add funding source</button>${hint?`<button type="button" class="btn sm ghost" data-share>Apply ${esc(PROGRAMS[hint.program].short)} ${hint.fedShare}/${100-hint.fedShare} split</button>`:""}</div>
      <div class="fund-tot ${cost && Math.abs(total-cost)>0.01?"bad":""}">Total ${money(total)} of ${money(cost||0)} unit cost${cost && Math.abs(total-cost)>0.01?` · ${total<cost?"short":"over"} by ${money(Math.abs(cost-total))}`:""}${cost?` · federal ${pct(lines.filter(l=>l.src&&l.src!==LOCAL).reduce((s,l)=>s+(+l.amt||0),0)/cost*100)}`:""}</div>
      ${fedIds.length>1?`<p class="note">More than one federal award: record the allocation basis below (2 CFR 200.405(d)).</p>`:""}
    </div>`;
    container.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",()=>{
      const l = lines[+el.dataset.n];
      if (el.dataset.k==="amt") l.amt = el.value === "" ? "" : round2(+el.value);
      else { l.src = el.value; if ((l.amt===""||l.amt==null) && getCost()) l.amt = round2(Math.max(0, getCost() - lines.reduce((s,x)=>s+(+x.amt||0),0))); }
      draw();
    }));
    container.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ lines.splice(+b.dataset.del,1); draw(); });
    container.querySelector("[data-addline]").onclick = ()=>{ const c=getCost(), t=lines.reduce((s,l)=>s+(+l.amt||0),0); lines.push({src:"", amt: c ? round2(Math.max(0,c-t)) : ""}); draw(); };
    const sh = container.querySelector("[data-share]");
    if (sh) sh.onclick = ()=>{ const c = getCost(); const f = round2(c*hint.fedShare/100); lines.splice(0, lines.length, {src:hint.id, amt:f}, {src:LOCAL, amt:round2(c-f)}); draw(); };
  };
  draw();
  return draw;
}

function guessCat(desc){
  const d = desc.toLowerCase();
  const custom = Object.keys(CATEGORIES).find(c => !["Other"].includes(c) && d.includes(c.toLowerCase()));
  if (custom) return custom;
  if (/trailer/.test(d)) return "Trailer";
  if (/light tower/.test(d)) return "Light tower";
  if (/generator/.test(d)) return "Generator / power";
  if (/x-?ray|scan|detect/.test(d)) return "Detection / X-ray";
  if (/radio|camera|router|repeater/.test(d)) return "Communications";
  if (/suit|helmet|mask|boot|vest|plate|carrier|ppe/.test(d)) return "PPE / Hazmat";
  if (/software|license|subscription|knowbe4/.test(d)) return "Software";
  return CATEGORIES["Other"] != null ? "Other" : Object.keys(CATEGORIES)[0];
}
function guessSite(loc){
  const l = (loc||"").toLowerCase();
  for (const [k,s] of Object.entries(SITES)) if (l.includes(s.name.toLowerCase())) return k;
  for (const [c,k] of Object.entries(COUNTY_SEAT)) if (l.includes(c)) return k;
  return "";
}
function toISODate(v){
  if (v === "" || v == null) return "";
  if (typeof v === "number" && v > 20000 && v < 80000){ const d = new Date(Math.round((v-25569)*864e5)); return iso(d); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return "invalid";
}
function toNum(v){ if (typeof v === "number") return v; const s = String(v??"").replace(/[$,\s]/g,""); return s === "" ? NaN : parseFloat(s); }
function resolveFund(text, fallback){
  const t = String(text||"").toLowerCase();
  if (!t) return fallback;
  if (/local|county funds|city funds|state funds/.test(t)) return LOCAL;
  const prog = /homeland|hsgp|shsp|uasi/.test(t) ? "HSGP" : /empg|performance/.test(t) ? "EMPG" : /public assistance|\bdr-?\d|disaster|\bpa\b/.test(t) ? "PA" : "";
  const y = (t.match(/20(\d\d)/)||[])[0];
  const hit = AWARDS.find(a => !a.archived && a.program === prog && (!y || String(a.fy) === y));
  return hit ? hit.id : fallback;
}

    <div class="mapgrid2">${FIELDS.map(f=>`<div class="field"><label for="m-${f.k}">${f.label}${f.req?" *":""}</label><select id="m-${f.k}" data-map="${f.k}"><option value="-1">Not in file</option>${headers.map((h,c)=>`<option value="${c}" ${up.map[f.k]===c?"selected":""}>${esc(String(h).trim()||"Column "+(c+1))}</option>`).join("")}</select></div>`).join("")}</div>
    <div id="up-prev"></div>
  </div>`;
  $("#up-reset").onclick = ()=>{ up = null; renderUpload(); };
  $("#up-sheet").onchange = e=>{ up.sheet = e.target.value; autoHeader(); renderUpload(); };
  $("#up-hdr").onchange = e=>{ up.headerRow = Math.max(0,(+e.target.value||1)-1); guessMap(); renderUpload(); };
  $("#up-sub").onchange = e=>{ up.sub = e.target.value; renderUpload(); };
  const sn = $("#up-subnew"); if (sn) sn.onchange = e=>{ up.subNew = e.target.value.trim(); drawPreview(); };
  $("#up-award").onchange = e=>{ up.award = e.target.value; drawPreview(); };
  document.querySelectorAll("[data-map]").forEach(el=>el.onchange = ()=>{ up.map[el.dataset.map] = +el.value; drawPreview(); });

}
function readFile(file){
  if (typeof XLSX === "undefined"){ toast("The spreadsheet reader didn't load"); return; }
  const r = new FileReader();
  r.onload = e=>{
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:false});
      up = { wb, name:file.name, sheet:wb.SheetNames[0], headerRow:0, map:{}, sub:subs()[0]||"__new", subNew:"", award:activeAwards()[0]?.id, include:{} };
      autoHeader(); renderUpload();
    } catch(err){ $("#up-msg").textContent = "That file couldn't be read. Save it as .xlsx or .csv and try again."; }
  };
  r.readAsArrayBuffer(file);
}
function getSheetRows(){ return XLSX.utils.sheet_to_json(up.wb.Sheets[up.sheet], {header:1, raw:true, defval:""}); }
function autoHeader(){
  const rows = getSheetRows();
  let best = 0, score = -1;
  rows.slice(0,15).forEach((r,n)=>{ const s = r.filter(c=>/desc|serial|cost|tag|location|date|fund/i.test(String(c))).length; if (s > score){ score = s; best = n; } });
  up.headerRow = best; guessMap();
}
function guessMap(){
  const headers = (getSheetRows()[up.headerRow]||[]).map(h=>String(h).trim());
  const used = new Set(); up.map = {};
  FIELDS.forEach(f=>{ const c = headers.findIndex((h,i)=>h && !used.has(i) && f.re.test(h)); up.map[f.k] = c; if (c>=0) used.add(c); });
  up.include = {};
}
function buildRows(){
  const rows = getSheetRows().slice(up.headerRow+1);
  const hdr = (getSheetRows()[up.headerRow]||[]).map(h=>String(h).trim());
  const clean = v => typeof v === "string" ? v.trim() : v;
  // Merged header cells often leave the data one column left or right of its header; look there when the header's own column is empty.
  const get = (r,k)=>{ const c = up.map[k]; if (c==null || c<0) return ""; let v = clean(r[c]);
    if (v === "" || v == null) for (const d of [-1,1]) { const n = c+d; if (n>=0 && !hdr[n] && clean(r[n]) !== "" && r[n] != null){ v = clean(r[n]); break; } }
    return v; };
  const sub = up.sub === "__new" ? (up.subNew||"") : up.sub;
  const groups = [], out = [];
  let cur = null;
  rows.forEach((r, n)=>{
    const rowNo = up.headerRow + 2 + n;
    const v = {}; FIELDS.forEach(f=>v[f.k]=get(r,f.k));
    const has = k => v[k] !== "" && v[k] != null;
    const any = FIELDS.some(f=>has(f.k));
    if (!any) return;
    if (!has("desc") && !has("serial") && !has("tag") && !has("cost")){ out.push({rowNo, skip:"Note or footnote row", raw:r.filter(Boolean).join(" ")}); return; }
    if (!has("desc") && (has("serial") || has("tag"))){
      if (cur) cur.units.push({rowNo, v});
      else out.push({rowNo, skip:"Serial or tag with no description above it", raw:r.filter(Boolean).join(" ")});
      return;
    }
    cur = {rowNo, v, units: (has("serial")||has("tag")) ? [{rowNo, v}] : []};
    groups.push(cur);
  });
  groups.forEach(g=>{
    let units = g.units.length ? g.units : [{rowNo:g.rowNo, v:g.v}];
    const expanded = [];
    units.forEach(u=>{
      const tags = String(u.v.tag||"").match(/\d+/g) || [];
      if (tags.length > 1) tags.forEach(t=>expanded.push({rowNo:u.rowNo, v:{...u.v, tag:t}, multiTag:true}));
      else expanded.push(u);
    });
    const total = toNum(g.v.cost);
    const childHaveCost = expanded.length > 1 && expanded.every(u=>u.rowNo !== g.rowNo && !isNaN(toNum(u.v.cost)) && toNum(u.v.cost) > 0);
    const n = expanded.length;
    expanded.forEach((u, idx)=>{
      const pick = k => (u.v[k] !== "" && u.v[k] != null) ? u.v[k] : g.v[k];
      let cost = childHaveCost ? toNum(u.v.cost) : (n > 1 ? (isNaN(total)?NaN: (idx === n-1 ? round2(total - round2(total/n)*(n-1)) : round2(total/n))) : total);
      const desc = String(g.v.desc||"").trim();
      const acquired = toISODate(pick("acquired"));
      const fundSrc = resolveFund(pick("fund"), up.award);
      const location = String(pick("location")||"").trim();
      const cat = pick("cat") && CATEGORIES[pick("cat")] != null ? pick("cat") : guessCat(desc);
      const it = { tag:String(u.v.tag||"").trim(), desc, make:String(pick("make")||"").trim(), serial:String(u.v.serial||"").trim(), cost:isNaN(cost)?NaN:round2(cost),
        acquired, approval: toISODate(pick("approval")), lastInv: toISODate(pick("lastInv")), location, site:guessSite(location), condition:String(pick("condition")||"").trim(),
        title:String(pick("title")||"").trim(), cat, sub, funding:[{src:fundSrc, amt:isNaN(cost)?0:round2(cost)}], fundText:String(pick("fund")||""),
        group: n>1 ? `${idx+1} of ${n} · ${isNaN(total)?"":money(total)+" total"} · from row ${g.rowNo}` : `From row ${u.rowNo}`, rowNo:u.rowNo, multiTag:u.multiTag };
      if (it.approval === "invalid") it.approval = "";
      if (it.lastInv === "invalid") it.lastInv = "";
      out.push({rowNo:u.rowNo, it});
    });
  });
  // checks
  const serialSeen = {};
  out.filter(o=>o.it && o.it.serial).forEach(o=>{ const s=o.it.serial.toLowerCase(); serialSeen[s]=(serialSeen[s]||0)+1; });
  out.forEach(o=>{
    if (!o.it) return;
    const it = o.it, iss = [];
    if (!it.desc) iss.push(["e","No description"]);
    if (isNaN(it.cost)) iss.push(["e","Cost missing or not a number"]);
    else if (it.cost === 0) iss.push(["w","Cost is $0, may be an accessory in a bundle"]);
    if (!it.acquired) iss.push(["e","Acquisition date missing"]);
    else if (it.acquired === "invalid") iss.push(["e","Acquisition date not recognized"]);
    if (!sub) iss.push(["e","Choose a subrecipient"]);
    if (BANNED.test(it.desc+" "+it.make)) iss.push(["e","§889 prohibited brand"]);
    if (it.serial && serialSeen[it.serial.toLowerCase()] > 1) iss.push(["w","Serial repeats in this file"]);
    const dupe = it.serial && items.find(x=>x.serial && x.serial.toLowerCase()===it.serial.toLowerCase());
    if (dupe) iss.push(["w",`Serial already on register${dupe.tag?" (tag "+dupe.tag+")":""}`]);
    if (it.multiTag) iss.push(["i","Split from a row listing several tags"]);
    if (it.fundText && it.funding[0].src === up.award && resolveFund(it.fundText, "__none") === "__none") iss.push(["w",`Funding "${it.fundText}" not matched, used ${srcLabel(up.award)}`]);
    const thr = it.funding[0].src === LOCAL ? 5000 : effThreshold(award(it.funding[0].src));
    if (!isNaN(it.cost) && it.cost < thr) iss.push(["i",`Below ${money0(thr)} threshold, will be listed as supplies`]);
    if (!it.serial && !isNaN(it.cost) && it.cost >= thr) iss.push(["w","No serial number"]);
    o.issues = iss;
    o.ok = !iss.some(x=>x[0]==="e");
    const key = "r"+o.rowNo+"-"+it.tag+"-"+it.serial;
    o.key = key;
    if (up.include[key] === undefined) up.include[key] = o.ok;
  });
  return out;
}
function drawPreview(){
  const box = $("#up-prev");
  const missing = FIELDS.filter(f=>f.req && !(up.map[f.k] >= 0));
  if (missing.length){ box.innerHTML = `<p class="alertbox"><strong>Match a column for: ${missing.map(f=>f.label.toLowerCase()).join(", ")}.</strong></p>`; return; }
  const out = buildRows();

  const chosen = its.filter(o=>up.include[o.key]);
  box.innerHTML = `
    <div><h3>Check rows</h3><p class="note">${its.length} items found${skips.length?`, ${skips.length} rows skipped`:""}. Grouped purchases are split into one item per unit with the cost divided evenly. Uncheck any row you don't want.</p></div>
    <div class="tablewrap flat"><table class="prev">
      <thead><tr><th>Add</th><th>Row</th><th>Tag</th><th>Description</th><th>Serial</th><th class="num">Unit cost</th><th>Acquired</th><th>Funding</th><th>Location</th><th>Checks</th></tr></thead>
      <tbody>${out.map(o=>o.skip?`<tr class="skip"><td></td><td class="mono">${o.rowNo}</td><td colspan="7" class="dim">${esc(o.raw).slice(0,120)}</td><td><div class="iss"><span class="i">Skipped: ${esc(o.skip)}</span></div></td></tr>`:
        `<tr class="${up.include[o.key]?"":"skip"}"><td><input type="checkbox" data-inc="${esc(o.key)}" ${up.include[o.key]?"checked":""} ${o.ok?"":"disabled"} aria-label="Add row ${o.rowNo}"></td>
          <td class="mono">${o.rowNo}</td><td>${o.it.tag?`<span class="assettag">${esc(o.it.tag)}</span>`:'<span class="notag">none</span>'}</td>
          <td>${esc(o.it.desc)}<div class="dim">${esc(o.it.group)}</div></td><td class="mono">${esc(o.it.serial)||"—"}</td><td class="num">${money(o.it.cost)}</td>
          <td>${o.it.acquired && o.it.acquired!=="invalid"?fmt(parse(o.it.acquired)):"—"}</td><td>${esc(srcLabel(o.it.funding[0].src))}</td><td>${esc(o.it.location)||"—"}</td>
          <td><div class="iss">${o.issues.length?o.issues.map(([l,m])=>`<span class="${l}">${l==="e"?"Error: ":l==="w"?"Check: ":""}${esc(m)}</span>`).join(""):'<span class="i">No issues</span>'}</div></td></tr>`).join("")}</tbody>
    </table></div>
    <div class="btns"><button class="btn" id="up-go" ${chosen.length?"":"disabled"}>Add ${chosen.length} item${chosen.length===1?"":"s"} to the register</button></div>`;
  box.querySelectorAll("[data-inc]").forEach(cb=>cb.onchange = ()=>{ up.include[cb.dataset.inc] = cb.checked; drawPreview(); });
  $("#up-go").onclick = ()=>{
    chosen.forEach(o=>{ const it = {...o.it}; delete it.fundText; delete it.rowNo; delete it.multiTag;
      items.push(Object.assign(it, {id:nextId++, basis:"", ndaaOk:false, disp:null, archived:null, intangible:it.cat==="Software"})); });
    const n = chosen.length; const subName = chosen[0]?.it.sub;
    up = null; uploadOpen = false; filter = {q:"",grant:"all",sub:subName||"all",status:"active",flag:""};
    renderRegister(); toast(`Added ${n} item${n===1?"":"s"} from the upload`);
  };
}

/* ---------- equipment review (Monitoring Guide Section III) ---------- */
const STEPS = [

  "Review the accounting reports for the funded programs to determine if any equipment was charged to the State."

const ATTRS = [ {k:"tag", label:"Tag on item"}, {k:"serial", label:"Serial matches"}, {k:"loc", label:"Location matches"}, {k:"cond", label:"Condition"}, {k:"appr", label:"Prior approval"}, {k:"n889", label:"§889 brand"} ];
const reviews = {};
let revSub = "";
function mulberry32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function getReview(sub){
  if (!reviews[sub]) reviews[sub] = { contract:"", date:iso(TODAY), initials:"", steps:STEPS.map(()=>({ans:"", init:"", wp:""})), invReceived:false, invDate:"", size:"", seed:String(1000+Math.floor(Math.random()*9000)), sample:[], tests:{}, conclusions:"" };
  return reviews[sub];
}
const prefill = it => ({ appr: it.approval ? "Pass" : "Exception", n889: ndaaState(it)==="ndaa" ? "Exception" : (ndaaState(it)==="ndaaCheck" ? "" : "Pass") });
function reviewExceptions(r){
  const ex = [];
  r.sample.map(id=>items.find(i=>i.id===id)).filter(Boolean).forEach(it=>{ const t = r.tests[it.id]||{}; ATTRS.forEach(a=>{ if (t[a.k]==="Exception") ex.push(`${it.tag?"Tag "+it.tag:it.desc} (${it.serial||"no serial"}): ${a.label.toLowerCase()}`); }); });
  return ex;
}
function summaryText(sub, r, pop){
  const sampled = r.sample.map(id=>items.find(i=>i.id===id)).filter(Boolean);

  const untested = sampled.filter(it=>ATTRS.some(a=>!(r.tests[it.id]||{})[a.k])).length;
  return [
    `Subrecipient: ${sub}${r.contract?" · Contract "+r.contract:""} · Review date ${fmt(parse(r.date))}${r.initials?" · "+r.initials:""}`,
    `Inventory: ${r.invReceived?"obtained"+(r.invDate?" "+fmt(parse(r.invDate)):""):"not yet obtained"}. ${pop.length} equipment items on record.`,
    sampled.length ? `Sample: ${sampled.length} of ${pop.length} items chosen by random draw (seed ${r.seed}).` : `Sample: not yet drawn.`,
    `Attributes tested: ${ATTRS.map(a=>a.label.toLowerCase()).join(", ")}, plus photo/WP reference.`,
    ex.length ? `Exceptions (${ex.length}):\n- ${ex.join("\n- ")}` : (sampled.length && !untested ? "Exceptions: none." : ""),
    untested ? `${untested} sampled item${untested>1?"s":""} not fully tested yet.` : ""

function lastReviewFor(subList){

function buildReport(){

  const all = items.filter(i => byGrant ? fundsAward(i, rep.key) : i.sub === rep.key);
  const eq = all.filter(i=>status(i).key==="equipment");
  const share = i => byGrant ? i.funding.filter(l=>l.src===rep.key).reduce((t,l)=>t+(+l.amt||0),0) : fedAmt(i);
  const pctOf = i => i.cost ? share(i)/i.cost : 0;
  const bookAll = eq.reduce((s,i)=>s+depreciation(i,asOf).book,0);
  const fedBook = eq.reduce((s,i)=>s+depreciation(i,asOf).book*pctOf(i),0);
  const recOK = i => !!(i.desc && i.serial && i.title && i.acquired && i.cost && i.condition && i.location && !/split|other|\*/i.test(i.location) && Math.abs(fundTotal(i)-i.cost)<=0.01 && !fedAwardIds(i).some(id=>!award(id).fain));
  const disposed = all.filter(i=>i.disp?.date);
  const checks = [
    {label:"Property record fields complete", ref:"2 CFR 200.313(d)(1)", pass:eq.filter(recOK).length, total:eq.length},
    {label:"Physical inventory within 2 years", ref:"2 CFR 200.313(d)(2)", pass:eq.filter(i=>{const s=inventory(i,asOf).state; return s==="ok"||s==="soon";}).length, total:eq.length},
    {label:"State prior approval on file", ref:"Contract D.20", pass:eq.filter(i=>i.approval).length, total:eq.length, tip:TIPD20},
    {label:"No §889 prohibited brands", ref:"NDAA §889 · 2 CFR 200.216", pass:all.filter(i=>!i.archived && ndaaState(i)!=="ndaa").length, total:all.filter(i=>!i.archived).length, note:`${all.filter(i=>!i.archived && ndaaState(i)==="ndaaCheck").length} camera or telecom items still to verify`, tip:TIP889},
    {label:"Dispositions fully recorded", ref:"2 CFR 200.313(e)", pass:disposed.filter(i=>i.disp.date && i.disp.method && (i.disp.fmv!==""||i.disp.price!=="")).length, total:disposed.length},
    {label:"Shared costs have an allocation basis", ref:"2 CFR 200.405(d)", pass:eq.filter(i=>fedAwardIds(i).length<2 || i.basis.trim()).length, total:eq.length}
  ];
  const exceptions = [];
  all.forEach(i=>flags(i,asOf).filter(k=>k!=="ndaaCheck").forEach(k=>exceptions.push({i, k})));
  const subsIn = [...new Set(all.map(i=>i.sub))];
  const revs = subsIn.map(s=>({s, r:reviews[s]})).filter(x=>x.r && x.r.sample.length);
  const title = byGrant ? `${srcLabel(rep.key)} · Equipment compliance record` : `${rep.key} · Equipment compliance record`;
  const header = byGrant
    ? (rep.key===LOCAL ? [["Funding","Local / State (non-federal)"]] : [["Program",PROGRAMS[g.program]?.name||g.program],["Award",awardLabel(g)],["FAIN",g.fain||"Not on file"],["Program federal share",g.fedShare+"%"],["Equipment threshold",money0(effThreshold(g))+" per unit"],["Status",g.archived?`Archived ${fmt(new Date(g.archived.at))} by ${g.archived.by}`:"Active"],["Subrecipients",subsIn.join(", ")||"—"]])
    : [["Subrecipient",rep.key],["Grants",[...new Set(all.flatMap(i=>i.funding.map(l=>srcLabel(l.src))))].join(", ")||"—"],["Contract numbers",reviews[rep.key]?.contract||"—"],["Last monitoring review",fmt(parse(lastReviewFor([rep.key])))]];
  return {asOf, byGrant, all, eq, share, pctOf, bookAll, fedBook, checks, exceptions, disposed, revs, title, header, below:all.filter(i=>status(i).key==="below").length, archived:all.filter(i=>i.archived)};
}

const TN = [[-90.31,35.00],[-88.20,34.995],[-85.61,34.98],[-84.32,34.99],[-84.29,35.22],[-84.03,35.29],[-83.95,35.46],[-83.67,35.57],[-83.25,35.70],[-82.96,35.80],[-82.61,35.97],[-82.40,36.08],[-82.22,36.15],[-82.03,36.12],[-81.93,36.29],[-81.71,36.33],[-81.68,36.59],[-83.68,36.60],[-86.50,36.65],[-88.07,36.68],[-88.07,36.50],[-89.42,36.50],[-89.60,36.20],[-89.70,35.95],[-89.95,35.70],[-90.07,35.40],[-90.05,35.15]];
let mapView = "fit", selSite = null;
function renderMap(){
  const v = $("#view-map");
  const live = items.filter(i => !["disposed","archived"].includes(status(i).key) && !i.intangible);
  const bySite = {};
  live.forEach(i => { if (i.site && SITES[i.site]) (bySite[i.site] = bySite[i.site] || []).push(i); });
  const unmapped = live.filter(i => !i.site || !SITES[i.site]);
  const W = 800, H = 520, K = Math.cos(36*Math.PI/180);
  let pts = mapView === "state" ? TN.map(([lon,lat])=>({lon,lat})) : Object.keys(bySite).map(k=>SITES[k]);
  if (!pts.length) pts = TN.map(([lon,lat])=>({lon,lat}));
  let minX = Math.min(...pts.map(p=>p.lon*K)), maxX = Math.max(...pts.map(p=>p.lon*K));
  let minY = Math.min(...pts.map(p=>-p.lat)), maxY = Math.max(...pts.map(p=>-p.lat));
  const pad = mapView === "state" ? 0.15 : 0.22;
  minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
  const s = Math.min(W/(maxX-minX), H/(maxY-minY));
  const ox = (W - (maxX-minX)*s)/2, oy = (H - (maxY-minY)*s)/2;
  const P = (lon,lat) => [ox + (lon*K - minX)*s, oy + (-lat - minY)*s];
  const outline = "M" + TN.map(([lo,la])=>P(lo,la).map(n=>n.toFixed(1)).join(",")).join("L") + "Z";
  const showLabels = mapView !== "state";
  const markers = Object.entries(bySite).map(([k,list])=>{
    const [x,y] = P(SITES[k].lon, SITES[k].lat);
    const gaps = list.some(i=>flags(i).length);
    const r = 11 + Math.min(8, list.length*1.5);
    return `<g class="site${selSite===k?" sel":""}" data-site="${k}" tabindex="0" role="button" aria-label="${esc(SITES[k].name)}: ${list.length} items${gaps?", has record gaps":""}">
      ${selSite===k?`<circle class="ring" cx="${x}" cy="${y}" r="${r+5}"></circle>`:""}
      <circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="${gaps?"var(--crit)":"var(--navy)"}"></circle>
      <text class="n" x="${x}" y="${y+4}" text-anchor="middle">${list.length}</text>
      ${showLabels?`<text x="${x+r+6}" y="${y+4}">${esc(SITES[k].name)}</text>`:""}</g>`;
  }).join("");
  const sel = selSite && bySite[selSite];
  v.innerHTML = `<div class="mapgrid">
      <div class="mapbox">
        <div class="maptools">
          <div class="legend"><span><i style="background:var(--navy)"></i>All records complete</span><span><i style="background:var(--crit)"></i>Has record gaps</span><span>Number = items at site</span></div>
          <div class="seg" role="group" aria-label="Map extent"><button id="mv-fit" aria-pressed="${mapView==="fit"}">Fit to items</button><button id="mv-state" aria-pressed="${mapView==="state"}">Statewide</button></div>
        </div>
        <svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of equipment locations in Tennessee"><path class="state" d="${outline}"></path>${markers}</svg>
        <p class="note">Simplified state outline with markers at approximate city locations. The production version would use an ArcGIS map widget in Experience Builder, reading the same equipment layer as the app.</p>
      </div>
      <div class="panel">
        ${sel ? `<div><h2>${esc(SITES[selSite].name)}</h2><p class="note">${esc(SITES[selSite].county)} · ${sel.length} item${sel.length>1?"s":""} · ${money0(sel.reduce((a,i)=>a+i.cost,0))} acquisition cost</p></div>
          <ul class="sitelist">${sel.map(i=>{const fl=flags(i);return `<li tabindex="0" data-id="${i.id}"><span><span class="desc">${esc(i.desc)}</span><div class="dim">${esc(i.location)}</div></span><span>${fl.length?`<span class="pill p-crit">${fl.length} gap${fl.length>1?"s":""}</span>`:`<span class="pill p-ok">Complete</span>`}</span></li>`}).join("")}</ul>`
        : `<h3>Sites</h3><p class="note">Select a marker to see what is held there.</p>
          <ul class="sitelist">${Object.entries(bySite).map(([k,l])=>`<li tabindex="0" data-pick="${k}"><span>${esc(SITES[k].name)} <span class="dim">${esc(SITES[k].county)}</span></span><span class="count">${l.length}</span></li>`).join("")}</ul>`}
        ${unmapped.length?`<div class="eff"><strong>${unmapped.length} item${unmapped.length>1?"s":""} not mapped</strong> because the location is split or missing: ${unmapped.slice(0,6).map(i=>esc(i.desc)).join("; ")}${unmapped.length>6?"; …":""}.</div>`:""}
        ${sel?`<button class="btn ghost" id="site-clear">Show all sites</button>`:""}
      </div></div>`;
  $("#mv-fit").onclick = ()=>{ mapView="fit"; renderMap(); };
  $("#mv-state").onclick = ()=>{ mapView="state"; renderMap(); };
  v.querySelectorAll("g.site, [data-pick]").forEach(g=>{ const pick = ()=>{ selSite = g.dataset.site || g.dataset.pick; renderMap(); }; g.onclick = pick; g.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } }; });
  v.querySelectorAll(".sitelist li[data-id]").forEach(li=>{ li.onclick = ()=>openItem(+li.dataset.id); li.onkeydown = e=>{ if(e.key==="Enter") openItem(+li.dataset.id); }; });
  const c = $("#site-clear"); if (c) c.onclick = ()=>{ selSite=null; renderMap(); };
}

/* ---------- remove grant (modal) ---------- */
function openRemove(id){
  const g = awardById(id), name = awardLabel(g);
  const tied = items.filter(i=>fundsAward(i,id) && !i.archived);
  const only = tied.filter(i=>fedAwardIds(i).filter(x=>x!==id && !award(x).archived).length===0);
  const shared = tied.length - only.length;
  $("#modal-box").innerHTML = `
    <h2 id="m-title">Remove ${esc(name)}</h2>
    ${tied.length?`<div class="alertbox"><strong>${tied.length} item${tied.length>1?"s are":" is"} tied to this grant. Archive this equipment before removing the grant.</strong>
      <span>Archived items leave the register, overview and map but stay searchable and in reports. Records for equipment bought with federal funds must be kept for three years after final disposition (2 CFR 200.334(c)), so nothing is deleted.</span>
      ${shared?`<span>${shared} item${shared>1?"s are":" is"} also funded by another active grant and will stay active. This grant's share is marked archived.</span>`:""}</div>
      <label class="check"><input type="checkbox" id="m-arch"> Archive the ${only.length} item${only.length===1?"":"s"} funded only by this grant</label>`
      :`<p class="note">No equipment is tied to this grant.</p>`}
    <p class="note">The grant is archived, not deleted, so archived items keep its FAIN and rules. You can restore it from the Grant rules tab.</p>
    <div class="field"><label for="m-name">To remove this grant, type the grant name: <strong>${esc(name)}</strong></label><input id="m-name" autocomplete="off"></div>
    <div class="field"><label for="m-by">Your name (person removing the grant)</label><input id="m-by" autocomplete="name" value="${esc(session?.username||"")}"></div>
    <div class="btns"><button class="btn ghost" id="m-cancel">Cancel</button><button class="btn dangerfill" id="m-go" disabled>Remove grant</button></div>`;
  $("#modal").hidden = false; $("#m-name").focus();
  const check = ()=>{ $("#m-go").disabled = !($("#m-name").value.trim() === name && $("#m-by").value.trim() && (!tied.length || $("#m-arch").checked)); };
  ["m-name","m-by"].forEach(i=>$("#"+i).addEventListener("input",check)); const a = $("#m-arch"); if (a) a.onchange = check;
  $("#m-cancel").onclick = closeModal;
  $("#m-go").onclick = ()=>{
    const by = $("#m-by").value.trim(), at = new Date().toISOString();
    only.forEach(i=>i.archived = {by, at, grant:id});
    g.archived = {by, at, items:only.length};
    LOG.push({at, by, text:`Removed ${name}; archived ${only.length} item${only.length===1?"":"s"}${shared?`, ${shared} shared item${shared>1?"s":""} kept active`:""}`});
    closeModal(); renderRules(); toast(`${name} removed`);
  };
}
function closeModal(){ $("#modal").hidden = true; }
$("#modal").addEventListener("click", e=>{ if (e.target.id === "modal") closeModal(); });

function owedFor(it){
  const dp = it.disp || {}; const fmv = parseFloat(dp.fmv), price = parseFloat(dp.price), sold = dp.method === "Sold";
  const base = sold && !isNaN(price) ? price : fmv;
  return fedAwardIds(it).map(id=>{ const a = award(id), share = it.cost ? fedAmt(it,id)/it.cost : 0;
    return {id, label:awardLabel(a), share, threshold:a.fedThreshold, owed: (!isNaN(fmv) && fmv > a.fedThreshold && !isNaN(base)) ? round2(base*share) : 0, applies: !isNaN(fmv) && fmv > a.fedThreshold}; });
}

function copyText(text, fallbackEl){
  const fallback = ()=>{ if (fallbackEl){ fallbackEl.focus(); fallbackEl.select(); } toast("Select the text and copy it"); };
  try { navigator.clipboard.writeText(text).then(()=>toast("Copied"), fallback); } catch(e){ fallback(); }
}
const VIEWS = ["overview","register","review","reports","map","rules"];

let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2000); }
/* hover / focus help, positioned to stay on screen */
function showTip(el){
  const box = $("#tipbox"); box.textContent = el.dataset.tip; box.hidden = false;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(), pad = 12;
  let left = Math.min(Math.max(pad, r.left + r.width/2 - b.width/2), window.innerWidth - b.width - pad);
  let top = r.top - b.height - 8; if (top < pad) top = r.bottom + 8;
  box.style.left = left + "px"; box.style.top = top + "px";
}
const hideTip = ()=>{ $("#tipbox").hidden = true; };
document.addEventListener("mouseover", e=>{ const t = e.target.closest(".tip"); if (t) showTip(t); });
document.addEventListener("mouseout", e=>{ if (e.target.closest(".tip")) hideTip(); });
document.addEventListener("focusin", e=>{ const t = e.target.closest(".tip"); if (t) showTip(t); else hideTip(); });
document.addEventListener("scroll", hideTip, true);
/* ---------- ArcGIS sign-in (OAuth 2.0 authorization code with PKCE) ---------- */
let session = null;
const store = {
  get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
};
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function signIn(){
  try {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
    const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    store.set("arcgis_pkce", {verifier, state});
    const q = new URLSearchParams({client_id:ARCGIS.clientId, response_type:"code", redirect_uri:ARCGIS.redirectUri, code_challenge:challenge, code_challenge_method:"S256", state});
    window.location.assign(`${ARCGIS.portal}/oauth2/authorize?${q}`);
  } catch(e){ authMessage("Sign-in can't start on this page. Open the GitHub version to sign in."); }
}
async function tokenRequest(params){
  const r = await fetch(`${ARCGIS.portal}/oauth2/token`, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({client_id:ARCGIS.clientId, redirect_uri:ARCGIS.redirectUri, f:"json", ...params})});
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || j.error_description || "Sign-in failed");
  return j;
}
function saveSession(j, prev){
  session = { token:j.access_token, username:j.username || prev?.username || "", expires:Date.now() + (j.expires_in||1800)*1000, refresh:j.refresh_token || prev?.refresh || "" };
  store.set("arcgis_session", session);
}
async function initAuth(){
  const url = new URL(location.href);
  const code = url.searchParams.get("code"), err = url.searchParams.get("error"), state = url.searchParams.get("state");
  if (code || err){
    history.replaceState(null, "", location.pathname + location.hash);
    const pk = store.get("arcgis_pkce"); store.del("arcgis_pkce");
    if (err) return authMessage(`ArcGIS sign-in was cancelled or refused (${err}).`);
    if (!pk || (state && pk.state !== state)) return authMessage("Sign-in didn't complete. Try again.");
    try { saveSession(await tokenRequest({grant_type:"authorization_code", code, code_verifier:pk.verifier})); toast(`Signed in as ${session.username}`); }
    catch(e){ return authMessage(`Sign-in failed: ${e.message}. Check that this page's address is a redirect URI on the ArcGIS app.`); }
  } else {
    session = store.get("arcgis_session");
    if (session && session.expires < Date.now() + 60000){
      if (session.refresh){ try { saveSession(await tokenRequest({grant_type:"refresh_token", refresh_token:session.refresh}), session); } catch(e){ session = null; store.del("arcgis_session"); } }
      else { session = null; store.del("arcgis_session"); }
    }
  }
  if (session?.username && !rep.by) rep.by = session.username;
  renderAuth();
}
function signOut(){ session = null; store.del("arcgis_session"); renderAuth(); toast("Signed out"); }
function authMessage(m){ renderAuth(m); }
function renderAuth(msg){
  const el = $("#authbar"); if (!el) return;
  el.innerHTML = session
    ? `<span class="who">Signed in as <strong>${esc(session.username)}</strong></span><button class="btn sm authbtn" id="auth-out">Sign out</button>`
    : `<button class="btn sm authbtn" id="auth-in">Sign in with ArcGIS</button>${msg?`<span class="authmsg" role="alert">${esc(msg)}</span>`:""}`;
  const i = $("#auth-in"), o = $("#auth-out");
  if (i) i.onclick = signIn; if (o) o.onclick = signOut;
}

show("overview");
initAuth();
</script>
